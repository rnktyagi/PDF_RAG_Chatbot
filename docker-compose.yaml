version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # This prevents the container from crashing immediately if it hits a tiny error
    restart: always 

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    # Tells Docker to start the backend BEFORE it starts the frontend
    depends_on:
      - backend
    restart: always